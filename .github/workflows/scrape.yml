name: Scrape and Commit

on:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 7am Central (noon UTC)
  workflow_dispatch:


jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and render MN + TN in parallel
        id: scrape
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: |
          # Regions are independent: one region's dropout guard tripping
          # (a broken venue) must NOT block the other region's re-render
          # from being committed. And render always runs — even when the
          # scraper refused to overwrite stale shows.json — so the
          # current-week view stays correct off the last-good data.
          # Failures are recorded, not aborted here; the job fails at the
          # end (after committing whatever rendered) so the red run still
          # flags the broken region.
          scrape_region() {
            dir=$1
            rc=0
            (cd "$dir" && python scraper.py) || rc=1
            (cd "$dir" && python render.py) || rc=1
            return $rc
          }
          scrape_region mn &
          PID_MN=$!
          scrape_region tn &
          PID_TN=$!
          FAIL=0
          wait $PID_MN || { echo "::warning::MN scrape/render failed"; FAIL=1; }
          wait $PID_TN || { echo "::warning::TN scrape/render failed"; FAIL=1; }
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"

      - name: Commit updated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mn/ tn/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily scrape $(date -u +%Y-%m-%d)"
          git push

      - name: Fail run if any region failed
        if: steps.scrape.outputs.fail == '1'
        run: |
          echo "One or more regions failed to scrape — a venue likely needs attention."
          exit 1
